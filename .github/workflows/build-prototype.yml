name: Test Prototypes

on:
  pull_request:
    types: [ready_for_review, review_requested]

jobs:
  # Stage 13.4 of docs/refactor/: mandatory, merge-blocking layering check
  # (see docs/refactor/stage-13-enforce-and-document.md). Needs no C/C++
  # toolchain -- just walks src/kfx_*/{src,include} -- so it runs standalone
  # rather than piggybacking on one of the build jobs below.
  check-layering:
    name: "Check Library Layering"
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run layering check
      run: python3 scripts/check_layering.py --strict

  # docs/refactor/testing/: opt-in Catch2 unit-test harness for src/kfx_*/
  # libraries (stage 3: CI integration -- see
  # docs/refactor/testing/stage-01-framework-and-scaffold.md). Native Linux
  # only -- no Windows runner/Wine step exists to execute a mingw-cross-
  # compiled test binary (stage-01 §1). Reuses build-prototype-linux's apt
  # package list below so -DKFX_BUILD_TESTS=ON doesn't fall back to slow
  # FetchContent-from-source builds of SDL3/openal/luajit/etc. in CI --
  # kfx_common_opts (and therefore every kfx_*_utest target) always needs
  # the full dependency chain regardless of which single library is under
  # test.
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update system
      run: |
        set -eux
        sudo apt update
        sudo apt install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          curl \
          libavcodec-dev \
          libavformat-dev \
          libavutil-dev \
          libopenal-dev \
          libluajit-5.1-dev \
          libminizip-dev \
          libnatpmp-dev \
          libspng-dev \
          libswresample-dev \
          libwayland-dev \
          wayland-protocols \
          libdecor-0-dev \
          libxkbcommon-dev \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libdrm-dev \
          libgbm-dev \
          libasound2-dev \
          libpulse-dev \
          libdbus-1-dev \
          libudev-dev \
          libpng-dev \
          libjpeg-dev \
          libogg-dev \
          libvorbis-dev \
          libflac-dev \
          libmpg123-dev \
          libopusfile-dev \
          libminiupnpc-dev \
          libssl-dev \
          libzstd-dev \
          zlib1g-dev

    # Dependencies.cmake builds several deps from source regardless of the
    # apt packages above (centijson/astronomy/enet6 have no distro package at
    # all; ffmpeg is always built minimal-from-source; curl needs
    # libcurl4-openssl-dev, not installed here) -- cache their build output
    # (deps/.cache-lin64/, not out/_deps: Dependencies.cmake deliberately
    # caches outside the out/ build tree) so a re-run doesn't recompile
    # ffmpeg/curl/etc. from scratch. Keyed on Dependencies.cmake's hash so a
    # version bump invalidates it; shared with every other native-Linux job
    # below, which build the identical dependency set.
    - name: Cache third-party dependencies
      uses: actions/cache@v4
      with:
        path: deps/.cache-lin64
        key: ${{ runner.os }}-kfx-deps-lin64-${{ hashFiles('build/cmake/modules/Dependencies.cmake') }}

    - name: Configure and build
      run: |
        set -eux
        cmake -S . -B out -G Ninja -DCMAKE_BUILD_TYPE=Debug -DKFX_BUILD_TESTS=ON
        cmake --build out --target kfx_platform_utest kfx_config_utest kfx_pathfinding_utest kfx_sim_utest kfx_render_utest kfx_net_utest kfx_game_utest kfx_frontend_utest kfx_script_utest kfx_apploop_utest kfx_editor_utest -j"$(nproc)"

    - name: Run tests
      run: ctest --test-dir out --output-on-failure

  # docs/refactor/testing/comprehensive/stage-05-coverage-tooling.md:
  # informational only (no coverage floor -- see that document §5), so
  # this doesn't gate merging, just makes a report available on every PR.
  # A separate job, not a step tacked onto unit-tests above: it needs its
  # own build tree (out/coverage, not out) since --coverage-instrumented
  # objects behave differently under a debugger than the plain ones
  # unit-tests' fast iteration loop relies on -- see that stage's §4.
  coverage:
    name: "Coverage Report"
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update system
      run: |
        set -eux
        sudo apt update
        sudo apt install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          curl \
          libavcodec-dev \
          libavformat-dev \
          libavutil-dev \
          libopenal-dev \
          libluajit-5.1-dev \
          libminizip-dev \
          libnatpmp-dev \
          libspng-dev \
          libswresample-dev \
          libwayland-dev \
          wayland-protocols \
          libdecor-0-dev \
          libxkbcommon-dev \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libdrm-dev \
          libgbm-dev \
          libasound2-dev \
          libpulse-dev \
          libdbus-1-dev \
          libudev-dev \
          libpng-dev \
          libjpeg-dev \
          libogg-dev \
          libvorbis-dev \
          libflac-dev \
          libmpg123-dev \
          libopusfile-dev \
          libminiupnpc-dev \
          libssl-dev \
          libzstd-dev \
          zlib1g-dev

    # See unit-tests' identical cache step above for why this is needed;
    # same key too -- it's a repo-relative path independent of build dir
    # (out/ vs out/coverage/), so this job and unit-tests share one cache.
    - name: Cache third-party dependencies
      uses: actions/cache@v4
      with:
        path: deps/.cache-lin64
        key: ${{ runner.os }}-kfx-deps-lin64-${{ hashFiles('build/cmake/modules/Dependencies.cmake') }}

    - name: Configure and build (instrumented)
      run: |
        set -eux
        cmake -S . -B out/coverage -G Ninja -DKFX_OS=linux -DCMAKE_BUILD_TYPE=Debug \
          -DKFX_BUILD_TESTS=ON -DKFX_TEST_COVERAGE=ON
        cmake --build out/coverage --target kfx_platform_utest kfx_config_utest kfx_pathfinding_utest kfx_sim_utest kfx_render_utest kfx_net_utest kfx_game_utest kfx_frontend_utest kfx_script_utest kfx_apploop_utest kfx_editor_utest -j"$(nproc)"

    - name: Run tests
      run: ctest --test-dir out/coverage --output-on-failure

    - name: Generate report
      run: cmake --build out/coverage --target coverage

    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: out/coverage/coverage-html/**

  build-prototype:
    name: "Build Prototype Windows x86"
    runs-on: ubuntu-24.04
    environment:
      name: Windows Prototype
      url: ${{ steps.upload.outputs.artifact-url }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: dkfans/setup-cpp@master

    - name: Update system
      run: |
        set -eux
        sudo apt update
        sudo apt install -y build-essential g++-mingw-w64-i686 cmake ninja-build libpng16-16t64 7zip

    # Dependencies.cmake now cross-compiles every non-SDL3 third-party dep
    # from source for this mingw32 target (ffmpeg/curl/openal/luajit
    # included) -- cache the build output (deps/.cache-mingw32/, not
    # out/_deps: Dependencies.cmake deliberately caches outside the out/
    # build tree) so a re-run doesn't redo all of that. Shared with every
    # other mingw32 job in this file and in build-alpha/release-patch-
    # unsigned.yml, which all run the identical mingw32 configure+build.
    - name: Cache third-party dependencies
      uses: actions/cache@v4
      with:
        path: deps/.cache-mingw32
        key: ${{ runner.os }}-kfx-deps-mingw32-${{ hashFiles('build/cmake/modules/Dependencies.cmake') }}

    - name: Configure and build package
      run: |
        set -eux
        BUILD_NUMBER=$(git rev-list --count origin/master)
        GITHUB_SHA=$(cat $GITHUB_EVENT_PATH | jq -r .pull_request.head.sha)
        PACKAGE_SUFFIX=Prototype_$(git rev-parse --short=7 "$GITHUB_SHA")
        # Compile both binaries with CMake (MinGW-w64 i686 cross-compile).
        cmake -S . -B out -G Ninja -DCMAKE_TOOLCHAIN_FILE=build/cmake/toolchains/mingw32.cmake \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DBUILD_NUMBER=$BUILD_NUMBER -DPACKAGE_SUFFIX=$PACKAGE_SUFFIX
        cmake --build out --target keeperfx keeperfx_hvlog -j"$(nproc)"
        # Assemble game data with the make pipeline (.dat data); the CMake build
        # already provides the binaries and SDL runtime DLLs. Then archive with CPack.
        make BUILD_NUMBER=$BUILD_NUMBER PACKAGE_SUFFIX=$PACKAGE_SUFFIX pkg-assemble
        cmake --build out --target package
        echo "ZIP_NAME=$(basename -s .7z pkg/keeperfx*.7z)" >> $GITHUB_ENV
        # CPack stages the binaries (keeperfx.exe, keeperfx_hvlog.exe) and the SDL3
        # runtime DLLs only inside the .7z archive, not into the loose pkg/ tree, so
        # uploading pkg/** would drop them. Install the full package layout into
        # dist/ so the uploaded artifact holds the binaries + DLLs + game data.
        cmake --install out --prefix dist
        rm pkg/keeperfx*.7z

    - name: Upload artifact
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: dist/**

    - name: Upload debug symbols
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}-symbols
        path: |
          out/keeperfx.exe.debug
          out/keeperfx_hvlog.exe.debug

  # CMake is the canonical, cross-platform build description (single
  # GLOB source list for main.cpp/ftests + src/kfx_*/CMakeLists.txt for
  # everything else -- see build/cmake/modules/Dependencies.cmake and
  # build/cmake/toolchains/mingw32.cmake). The job above drives packaging
  # through CMake too, but that goes via the `package` target (CPack), which
  # doesn't exercise CMake's own native compile of the keeperfx/
  # keeperfx_hvlog targets directly outside that pipeline. This job does, so
  # a regression in CMake's own compile still gets caught even though it's
  # redundant compute today.
  build-prototype-windows-cmake:
    name: "Build Prototype Windows x86 (CMake native compile, verification only)"
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update system
      run: |
        set -eux
        sudo apt update
        sudo apt install -y build-essential g++-mingw-w64-i686 ninja-build

    # See build-prototype's identical cache step above for why this is
    # needed; same key too -- deps/.cache-mingw32/ is a repo-relative path
    # independent of build dir (out/ vs build/), so this job shares that
    # job's cache.
    - name: Cache third-party dependencies
      uses: actions/cache@v4
      with:
        path: deps/.cache-mingw32
        key: ${{ runner.os }}-kfx-deps-mingw32-${{ hashFiles('build/cmake/modules/Dependencies.cmake') }}

    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=build/cmake/toolchains/mingw32.cmake -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --target keeperfx keeperfx_hvlog -j"$(nproc)"

  build-prototype-linux:
    name: "Build Prototype Linux x86_64"
    runs-on: ubuntu-24.04
    environment:
      name: Linux Prototype
      url: ${{ steps.upload.outputs.artifact-url }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update system
      run: |
        set -eux
        sudo apt update
        # SDL3 is not in Ubuntu 24.04 apt, so Dependencies.cmake builds it from
        # source (FetchContent). Wayland-only build (Dependencies.cmake sets
        # SDL_X11=OFF -- most distros have dropped X11 by default, and it pulls
        # a whole separate chain of X11 dev headers for a session type fewer
        # users actually run; SDL3 still auto-detects Wayland vs X11 sessions
        # at runtime, this just controls what gets compiled in). The wayland/
        # gl/audio and image/mixer decoder packages below are SDL3's build
        # deps. SDL_net is gone (native sockets).
        sudo apt install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          curl \
          libavcodec-dev \
          libavformat-dev \
          libavutil-dev \
          libopenal-dev \
          libluajit-5.1-dev \
          libminizip-dev \
          libnatpmp-dev \
          libspng-dev \
          libswresample-dev \
          libwayland-dev \
          wayland-protocols \
          libdecor-0-dev \
          libxkbcommon-dev \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libdrm-dev \
          libgbm-dev \
          libasound2-dev \
          libpulse-dev \
          libdbus-1-dev \
          libudev-dev \
          libpng-dev \
          libjpeg-dev \
          libogg-dev \
          libvorbis-dev \
          libflac-dev \
          libmpg123-dev \
          libopusfile-dev \
          libminiupnpc-dev \
          libssl-dev \
          libzstd-dev \
          zlib1g-dev

    # See unit-tests' identical cache step above for why this is needed;
    # same key too, shared across every native-Linux job in this file.
    - name: Cache third-party dependencies
      uses: actions/cache@v4
      with:
        path: deps/.cache-lin64
        key: ${{ runner.os }}-kfx-deps-lin64-${{ hashFiles('build/cmake/modules/Dependencies.cmake') }}

    - name: Build
      run: |
        set -eux
        VER_MAJOR=$(grep -E '^VER_MAJOR=' build/make/version.mk | cut -d= -f2)
        VER_MINOR=$(grep -E '^VER_MINOR=' build/make/version.mk | cut -d= -f2)
        VER_RELEASE=$(grep -E '^VER_RELEASE=' build/make/version.mk | cut -d= -f2)
        BUILD_NUMBER=$(git rev-list --count origin/master)
        GITHUB_SHA=$(cat $GITHUB_EVENT_PATH | jq -r .pull_request.head.sha)
        PACKAGE_SUFFIX=Prototype_$(git rev-parse --short=7 "$GITHUB_SHA")
        LINUX_ARTIFACT_NAME=keeperfx-linux_x86_64-${VER_MAJOR}_${VER_MINOR}_${VER_RELEASE}_${BUILD_NUMBER}_${PACKAGE_SUFFIX}-patch
        echo "LINUX_ARTIFACT_NAME=$LINUX_ARTIFACT_NAME" >> $GITHUB_ENV
        # Native Linux build with CMake (pkg-config deps + prebuilt lin64 static libs).
        cmake -S . -B out -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DBUILD_NUMBER=$BUILD_NUMBER -DPACKAGE_SUFFIX=$PACKAGE_SUFFIX
        cmake --build out --target keeperfx -j"$(nproc)"

    - name: Upload artifact
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.LINUX_ARTIFACT_NAME }}
        path: out/keeperfx
